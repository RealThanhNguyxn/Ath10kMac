name: Build Ath10kMac Dell QCA9377

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-dell-profile.yml'
      - 'qca9377-dell-board-profile.patch'

permissions:
  contents: read

jobs:
  build:
    # Intel macOS runner matches this project's x86_64 kext target.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Dell QCA9377 profile patch
        run: |
          git apply --check qca9377-dell-board-profile.patch
          git apply qca9377-dell-board-profile.patch

      - name: Generate payload and run payload tests
        run: |
          python3 scripts/prepare-firmware.py
          python3 -m unittest discover -s tests -p 'test_payload.py' -v

      - name: Build x86_64 kext
        run: |
          xcode-select -p
          xcrun --show-sdk-path
          make clean
          make

      - name: Package build artifact
        run: |
          test -f build/out/Ath10kMac.kext/Contents/MacOS/Ath10kMac
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/out/Ath10kMac.kext dist/Ath10kMac-QCA9377-Dell.kext.zip
          shasum -a 256 dist/Ath10kMac-QCA9377-Dell.kext.zip | tee dist/SHA256SUMS.txt

      - name: Upload kext artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ath10kMac-QCA9377-Dell-kext
          path: dist/*
          if-no-files-found: error
          retention-days: 7
